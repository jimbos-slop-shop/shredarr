<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<script>try{const t=localStorage.getItem('shredarr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><title>Sign in · Shredarr</title><link rel=icon href=/logo.svg?v=4 type="image/svg+xml"><link rel=apple-touch-icon href=/logo.png?v=4>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{color-scheme:light dark;--page:#f3f5f9;--panel:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#3b82f6;--brand2:#2563eb;--lime:#65a30d;--bad:#dc2626;--bad-weak:#fdecec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0a0c11;--panel:#11141b;--fg:#e8ecf3;--mut:#8590a3;--line:#222836;--brand:#5b9cff;--brand2:#7aaeff;--lime:#9ad65a;--bad:#f87171;--bad-weak:#341818}}:root[data-theme=dark]{--page:#0a0c11;--panel:#11141b;--fg:#e8ecf3;--mut:#8590a3;--line:#222836;--brand:#5b9cff;--brand2:#7aaeff;--lime:#9ad65a;--bad:#f87171;--bad-weak:#341818;color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:15px/1.5 Inter,-apple-system,sans-serif;color:var(--fg);
  background:radial-gradient(700px 320px at 15% 0%,rgba(59,130,246,.18),transparent 70%),radial-gradient(600px 300px at 90% 10%,rgba(101,163,13,.12),transparent 70%),var(--page)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 20px 50px rgba(0,0,0,.12);text-align:center}
img{width:76px;height:76px;filter:drop-shadow(0 8px 16px rgba(59,130,246,.25))}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:28px;margin:8px 0 2px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--brand),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);margin:0 0 22px;font-size:14px}form{display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-size:12.5px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:6px}
input{height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--fg);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
button{height:46px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:4px}
.err{background:var(--bad-weak);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:550}
.ok{background:rgba(22,163,74,.12);color:#16a34a;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:550}
.links{margin-top:16px;font-size:13.5px}.links a{color:var(--brand);text-decoration:none;font-weight:600}
.small{font-size:12.5px;color:var(--mut);margin:2px 0 4px;text-align:left}.small code{font-size:11.5px;word-break:break-all}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
</style></head><body><div class=card><img src=/logo.svg?v=4 alt=""><h1>Shred<span>arr</span></h1><p>%SUB%</p>%BODY%</div></body></html>
